# Reference Data Service - settings (every key: docs/DESIGN.md section 16; -Drds.* system properties override)
rds.db.url=jdbc:derby:data/medium
rds.tcp.port=7400
rds.http.port=7401
rds.validation.policy=FAIL
# extra codecs pre-encoded and offered to clients (NONE is always available)
rds.codecs=LZ4,ZSTD
rds.chunk.target.bytes=256k
rds.frame.max.bytes=1m
rds.max.connections=256
rds.max.concurrent.snapshots=8
rds.snapshot.queue.size=64
rds.snapshot.queue.max.wait=60s
rds.handshake.timeout=10s
rds.session.idle.timeout=60s
rds.stall.timeout=30s
rds.snapshot.max.duration=10min
rds.heartbeat.interval=5s
rds.shutdown.drain.timeout=30s
