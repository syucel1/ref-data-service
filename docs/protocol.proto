  string client_instance          = 6;   // host/pid or pod name
  string library_version          = 7;   // e.g. "refdata-client-java 1.2.0"
  repeated Codec accepted_codecs  = 8;   // in order of preference; NONE is always implied
  bool   keep_alive               = 9;   // keep the connection after the snapshot (heartbeats)
}

