// Reference Data Service - PROTOCOL contract (framing + control messages).
// Intended repository path: refdata-contract/src/main/proto/refdata/protocol/v1/protocol.proto
//
// Versioned by protocol_major (this package) - independently of the entity schema
// (refdata.schema.vN, file entities.proto). This file does not import the entity schema:
// chunk payloads are opaque bytes and entity types travel as plain numbers whose meaning is
// defined by refdata.schema.vN.EntityType.
//
// Framing: every frame on the TCP connection is
//   [ 4-byte unsigned length, big-endian ][ Envelope, exactly 'length' bytes ]
// 'length' excludes the prefix; 0 or > the receiver's limit is a protocol violation.
//
// FROZEN ACROSS ALL PROTOCOL MAJORS (so that version negotiation always works):
//   the framing above, Envelope field numbers 1, 2 and 8, fields 1-5 of Hello,
//   1-2 of HelloAck and 1-8 of ErrorReply, and ErrorCode values 1, 2, 3, 4, 7 and 9
//   (the codes that can be sent before or during the handshake).
//
// Compatibility rules (CI: buf lint + buf breaking with category WIRE):
//  * never change a field's number or type, never reuse a number - use 'reserved'
//  * add fields only; new fields must be safe to ignore by older readers
//  * every enum value is prefixed with the enum name; value 0 is <NAME>_UNSPECIFIED
//  * proto3 'optional' requires protoc / runtime 3.15 or later

syntax = "proto3";

package refdata.protocol.v1;

option java_package = "com.example.refdata.protocol.v1";
option java_multiple_files = true;

