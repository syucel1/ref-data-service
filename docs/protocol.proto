// ---------------------------------------------------------------------------
// Handshake and version negotiation
// ---------------------------------------------------------------------------
message Hello {
  uint32 protocol_major           = 1;   // must be >= 1; 0 (unset) is rejected
  uint32 protocol_minor           = 2;   // informational; minor differences are compatible
  repeated uint32 schema_majors   = 3;   // entity schema majors understood, e.g. [1] or [1, 2]
  uint32 max_frame_bytes          = 4;   // largest frame the client accepts; 0 = not stated = 1 MiB
