enum Codec {
  CODEC_UNSPECIFIED = 0;   // treated as NONE
  CODEC_NONE        = 1;
  CODEC_LZ4         = 2;   // LZ4 block format: fast, modest ratio
  CODEC_ZSTD        = 3;   // better ratio, more CPU
}

// ---------------------------------------------------------------------------
// Snapshot request / stream
// ---------------------------------------------------------------------------
message SnapshotRequest {
  uint64 request_id                 = 1;   // chosen by the client, >= 1; echoed in replies
  repeated uint32 entity_types      = 2;   // refdata.schema.vN.EntityType numbers; empty = all.
                                           // Types the server does not know are ignored (not an error).
  bytes  if_snapshot_id             = 3;   // "send only if different": client already holds this id
  bytes  resume_snapshot_id         = 4;   // non-empty = this is a resume of that snapshot...
  uint32 resume_from_seq            = 5;   // ...starting at this chunk; must lie inside the requested
                                           // ranges, and entity_types must equal the original request
  LiveResume live_resume            = 6;   // live sessions only: "I hold the full data at this version". The server
                                           // answers UpdatesResumed and replays the retained updates after it, or -
                                           // after a gap, another generation or expired history - serves a full
                                           // snapshot for this request as if the field were absent
}

// A live consumer's position, sent on reconnect to continue without a snapshot.
message LiveResume {
  bytes  generation                 = 1;   // HelloAck.update_generation of the connection the client last applied from
  uint64 data_version               = 2;   // data version of the client's store (last applied update)
}

// Answer to a SnapshotRequest with live_resume: the session continues as if its snapshot had just ended.
// The update_batch frames after data_version (moving from data_version onwards, in order) follow.
message UpdatesResumed {
  uint64 request_id                 = 1;
  uint64 data_version               = 2;   // echoes LiveResume.data_version: the first update has this base version
  SnapshotInfo current_snapshot     = 3;   // what a new consumer would receive now (informational)
}

message SnapshotInfo {
  bytes  snapshot_id              = 1;   // 16 bytes, content-derived (DESIGN.md 9.8):
                                         // same data + same build + same chunk settings => same id
  uint64 data_version             = 2;   // release id from REFDATA_RELEASE; 0 = not available
  uint32 schema_major             = 3;
  uint32 schema_minor             = 4;
  int64  built_at_epoch_ms        = 5;
  string source                   = 6;   // database identifier (no credentials)
  bytes  content_sha256           = 7;   // SHA-256 over the entity_sha256 values, in manifest order
  repeated EntityManifest entities = 8;  // in stream (dependency) order
  uint32 total_chunks             = 9;
  uint64 total_records            = 10;
  uint64 total_uncompressed_bytes = 11;
}

message EntityManifest {
  uint32 entity_type           = 1;   // refdata.schema.vN.EntityType number
  uint64 record_count          = 2;
  uint32 first_seq             = 3;   // chunks of this type are first_seq .. first_seq + chunk_count - 1
  uint32 chunk_count           = 4;
  uint64 uncompressed_bytes    = 5;   // wire size; the client library converts this to a heap estimate
  bytes  entity_sha256         = 6;   // SHA-256 over the uncompressed payloads of this type, in seq order
}

// Sent when a SnapshotRequest has to wait for an admission slot (DESIGN.md 9.6).
// SnapshotBegin follows when the transfer starts; heartbeats are sent while waiting.
message SnapshotQueued {
  uint64 request_id            = 1;
  uint32 queue_position        = 2;   // 1 = next
  uint32 max_wait_ms           = 3;   // after this the request is answered with SERVER_BUSY
}

message SnapshotBegin {
  uint64 request_id            = 1;
  SnapshotInfo snapshot        = 2;   // sent again on every resume, so the client can confirm the id
  bool   not_modified          = 3;   // true: if_snapshot_id matched; no chunks, SnapshotEnd follows
  repeated uint32 entity_types = 4;   // what will actually be sent, after filtering
  uint32 first_seq             = 5;   // first chunk this response will send (resume point, or start)
}

// Identical bytes for every session (pre-encoded once), so it carries no session fields.
message SnapshotChunk {
  uint32 seq                   = 1;   // global position in the full snapshot, from 0
  uint32 entity_type           = 2;   // refdata.schema.vN.EntityType number
  uint32 record_count          = 3;
  Codec  codec                 = 4;
  uint32 uncompressed_size     = 5;
  uint32 crc32                 = 6;   // CRC-32 (IEEE, as in zlib) over 'payload' exactly as sent
  bytes  payload               = 7;   // (compressed) serialized <Entity>Batch from refdata.schema.vN
}

message SnapshotEnd {
  uint64 request_id            = 1;
  uint32 chunks_sent           = 2;   // totals for the requested entity types over the whole transfer,
  uint64 records_sent          = 3;   // including chunks sent on earlier connections before a resume
  bytes  content_sha256        = 4;   // whole-snapshot hash; verify it only when no filter was applied
}

message Heartbeat {
  int64 sent_at_epoch_ms       = 1;
}

message GoAway {
  ErrorCode reason             = 1;
  string    message            = 2;
  uint32    reconnect_after_ms = 3;
}

// Named ErrorReply (not Error) to avoid clashing with java.lang.Error in generated Java code.
message ErrorReply {
  uint64    request_id               = 1;   // 0 when not tied to a request
  ErrorCode code                     = 2;
  string    message                  = 3;   // human readable, never parsed
  bool      fatal                    = 4;   // true: sender closes the connection after this frame
  uint32    retry_after_ms           = 5;   // hint for SERVER_BUSY
  uint32    supported_protocol_min   = 6;
  uint32    supported_protocol_max   = 7;
  repeated uint32 supported_schema_majors = 8;
  uint32    seq                      = 9;   // chunk concerned, for INTEGRITY_FAILURE reports
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED                  = 0;
  ERROR_CODE_PROTOCOL_VIOLATION           = 1;    // bad length, unparsable envelope, wrong message order
  ERROR_CODE_UNSUPPORTED_PROTOCOL_VERSION = 2;
  ERROR_CODE_UNSUPPORTED_SCHEMA_VERSION   = 3;
  ERROR_CODE_HANDSHAKE_TIMEOUT            = 4;
  ERROR_CODE_INVALID_REQUEST              = 5;    // e.g. bad resume point, second request while streaming
  ERROR_CODE_UNSUPPORTED_MESSAGE          = 6;    // envelope body not understood (newer peer); non-fatal
  ERROR_CODE_SERVER_BUSY                  = 7;    // connection limit, or admission wait exceeded
  ERROR_CODE_SNAPSHOT_NOT_AVAILABLE       = 8;    // resume_snapshot_id not served by this instance
  ERROR_CODE_FRAME_TOO_LARGE              = 9;
  ERROR_CODE_SLOW_CONSUMER                = 10;   // best effort; usually the connection is just closed
  ERROR_CODE_SERVER_SHUTTING_DOWN         = 11;
  ERROR_CODE_INTERNAL_ERROR               = 12;
  ERROR_CODE_IDLE_TIMEOUT                 = 13;   // no request after the handshake within the idle limit
  ERROR_CODE_INTEGRITY_FAILURE            = 14;   // C->S report: chunk 'seq' failed its CRC or count check
}
